<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.1" />
    </linearGradient>

    <style>
      @keyframes floatParticle {
        0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
        50% { transform: translateY(-15px) rotate(180deg); opacity: 0.7; }
        100% { transform: translateY(0px) rotate(360deg); opacity: 0.3; }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.4; }
        50% { opacity: 0.8; }
        100% { opacity: 0.4; }
      }
      @keyframes calcWave {
        0% { stroke-dashoffset: 600; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -600; }
      }
      .bg-particle { animation: floatParticle 8s ease-in-out infinite; transform-origin: center; }
      .glow-element { animation: pulseGlow 4s ease-in-out infinite; }
      .wave-line { stroke-dasharray: 300 300; animation: calcWave 12s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <g class="glow-element" opacity="0.5">
    <circle cx="150" cy="80" r="120" fill="url(#accent-grad)" filter="blur(20px)" />
    <circle cx="1050" cy="240" r="140" fill="url(#accent-grad)" filter="blur(25px)" />
  </g>

  <path class="wave-line" d="M 0,260 Q 300,180 600,260 T 1200,260" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3" />
  <path class="wave-line" d="M 0,280 Q 300,220 600,280 T 1200,280" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.2" />

  <g class="bg-particle" style="animation-delay: 0s;">
    <text x="100" y="120" fill="#38bdf8" font-size="28" font-family="monospace" opacity="0.3">∫ f(x)dx</text>
  </g>
  <g class="bg-particle" style="animation-delay: 2s;">
    <text x="1020" y="100" fill="#c084fc" font-size="32" font-family="monospace" opacity="0.3">∑ (n=1..∞)</text>
  </g>
  <g class="bg-particle" style="animation-delay: 4s;">
    <text x="80" y="240" fill="#818cf8" font-size="30" font-family="sans-serif" opacity="0.25">e = mc²</text>
  </g>
  <g class="bg-particle" style="animation-delay: 1s;">
    <text x="1060" y="210" fill="#f43f5e" font-size="26" font-family="sans-serif" opacity="0.25">π ≈ 3.14159</text>
  </g>

  <g text-anchor="middle">
    <g transform="translate(600, 75)">
      <rect x="-32" y="-32" width="64" height="64" rx="16" fill="#4f46e5" opacity="0.9" />
      <path d="M-14 -10 H14 M0 -24 V4 M-14 14 H14 M-12 14 L12 -10" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    </g>

    <text x="600" y="175" fill="url(#title-grad)" font-size="46" font-weight="800" font-family="system-ui, -apple-system, sans-serif" letter-spacing="1">
      Awesome Calculator Utility
    </text>

    <text x="600" y="220" fill="#cbd5e1" font-size="18" font-weight="400" font-family="system-ui, -apple-system, sans-serif" letter-spacing="0.5">
      🧮 Curated Software &amp; Open-Source Projects for Scientific Calculation, Math &amp; Conversions
    </text>

    <g transform="translate(600, 265)">
      <rect x="-260" y="-14" width="150" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="-185" y="4" fill="#38bdf8" font-size="12" font-weight="600" font-family="system-ui, sans-serif">⚡ Scientific &amp; RPN</text>

      <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" fill="#818cf8" font-size="12" font-weight="600" font-family="system-ui, sans-serif">📝 Natural Language Math</text>

      <rect x="110" y="-14" width="150" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="185" y="4" fill="#c084fc" font-size="12" font-weight="600" font-family="system-ui, sans-serif">🌐 Graphing &amp; Units</text>
    </g>
  </g>
</svg>
